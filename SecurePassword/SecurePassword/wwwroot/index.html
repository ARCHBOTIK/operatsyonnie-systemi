<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SecurePassword</title>
    <base href="/" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="home.css" />
    <link rel="stylesheet" href="generator.css" />
    <link rel="stylesheet" href="settings.css" />
    <link rel="stylesheet" href="sync-auth.css" />
    <link rel="icon" href="data:,">
</head>
<body>
    <div id="app"></div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>

    <script>
        window.bpFocus = function (id) {
            const el = document.getElementById(id);
            if (!el) return;

            const input = el;
            input.focus();

            const v = input.value ?? "";
            if (typeof input.setSelectionRange === "function") {
                input.setSelectionRange(v.length, v.length);
            }
        };

        let vaultActivityHandler = null;
        let vaultActivityTimer = null;

        window.vaultSetPlatformClass = function (platformClass) {
            document.body.classList.remove("platform-android", "platform-default");
            if (platformClass) {
                document.body.classList.add(platformClass);
            }
        };

        window.vaultRegisterActivity = function (dotNetRef) {
            window.vaultUnregisterActivity();

            vaultActivityHandler = function () {
                if (vaultActivityTimer) {
                    clearTimeout(vaultActivityTimer);
                }

                vaultActivityTimer = setTimeout(function () {
                    dotNetRef.invokeMethodAsync("NotifyActivity");
                }, 100);
            };

            ["pointerdown", "keydown", "touchstart", "scroll"].forEach(function (eventName) {
                window.addEventListener(eventName, vaultActivityHandler, { passive: true });
            });
        };

        window.vaultUnregisterActivity = function () {
            if (!vaultActivityHandler) {
                return;
            }

            ["pointerdown", "keydown", "touchstart", "scroll"].forEach(function (eventName) {
                window.removeEventListener(eventName, vaultActivityHandler);
            });

            if (vaultActivityTimer) {
                clearTimeout(vaultActivityTimer);
                vaultActivityTimer = null;
            }

            vaultActivityHandler = null;
        };
    </script>
</body>
</html>
