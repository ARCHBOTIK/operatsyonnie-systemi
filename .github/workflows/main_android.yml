name: Release Android

on:
  push:
    tags:
      - "android_v*.*.*"

permissions:
  contents: read

jobs:
  build-pack-upload:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: dotnet info
        shell: pwsh
        run: |
          dotnet --list-sdks
          dotnet --info

      - name: Install MAUI workloads
        shell: pwsh
        run: |
          dotnet workload install maui maui-android

      - name: Create keystore file
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:ANDROID_KEYSTORE_BASE64) {
            throw "ANDROID_KEYSTORE_BASE64 is empty"
          }

          [System.IO.File]::WriteAllBytes(
            "app.keystore",
            [System.Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          )

          if (-not (Test-Path ".\app.keystore")) {
            throw "app.keystore was not created"
          }

      - name: Publish Android APK
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Path ".\artifacts\publish\android" -Force | Out-Null

          dotnet publish ".\SecurePassword\SecurePassword\SecurePassword.csproj" `
            -c Release `
            -f net10.0-android `
            -p:JavaSdkDirectory="$env:JAVA_HOME" `
            -p:RuntimeIdentifier=android-arm64 `
            -p:AndroidPackageFormats=apk `
            -p:RunAOTCompilation=false `
            -p:AndroidEnableProfiledAot=false `
            -p:AndroidStripNativeLibraries=true `
            -p:AndroidLinkTool=r8 `
            -p:InvariantGlobalization=true `
            -p:InvariantTimezone=true `
            -p:SatelliteResourceLanguages=ru-RU%3Ben-US `
            -p:AndroidSigningKeyStore=app.keystore `
            -p:AndroidSigningKeyAlias=$env:ANDROID_KEY_ALIAS `
            -p:AndroidSigningKeyPass=$env:ANDROID_KEY_PASSWORD `
            -p:AndroidSigningStorePass=$env:ANDROID_KEYSTORE_PASSWORD `
            -o ".\artifacts\publish\android"

      - name: Collect Android artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ".\artifacts\releases\android" -Force | Out-Null
          Copy-Item ".\artifacts\publish\android\*.apk" ".\artifacts\releases\android\" -ErrorAction Stop
          Get-ChildItem ".\artifacts\releases\android"

      - name: Create release if missing
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.ANDROID_TOKEN }}
        run: |
          gh release view $env:GITHUB_REF_NAME --repo "ARCHBOTIK/SecurePassword_Releases" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME `
              --repo "ARCHBOTIK/SecurePassword_Releases" `
              --title $env:GITHUB_REF_NAME `
              --notes "Android release $env:GITHUB_REF_NAME"
          }

      - name: Upload APK to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.ANDROID_TOKEN }}
        run: |
          gh release upload $env:GITHUB_REF_NAME .\artifacts\releases\android\* `
            --clobber `
            --repo "ARCHBOTIK/SecurePassword_Releases"
