name: Release Windows

on:
  push:
    tags:
      - "windows_v*.*.*"

permissions:
  contents: read

jobs:
  build-pack-upload:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: dotnet info
        shell: pwsh
        run: |
          dotnet --list-sdks
          dotnet --info

      # ---------- Install MAUI workloads ----------
      - name: Restore MAUI workloads
        shell: pwsh
        run: dotnet workload install maui maui-windows maui-android maui-ios maui-maccatalyst

      # ---------- Restore ----------
      - name: Restore UI (Windows)
        shell: pwsh
        run: |
          dotnet msbuild ".\SecurePassword\SecurePassword\SecurePassword.csproj" `
            /t:Restore `
            /p:TargetFramework=net10.0-windows10.0.19041.0 `
            /p:RuntimeIdentifier=win-x64

      # ---------- Publish (framework-dependent, smaller size) ----------
      - name: Publish UI (framework-dependent)
        shell: pwsh
        run: |
          dotnet publish ".\SecurePassword\SecurePassword\SecurePassword.csproj" `
            -c Release `
            -f net10.0-windows10.0.19041.0 `
            -r win-x64 `
            --self-contained false `
            -p:PublishReadyToRun=false `
            -o ".\artifacts\publish"

      # ---------- Install Velopack ----------
      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool install --global vpk

      # ---------- Pack with Velopack ----------
      - name: Pack with Velopack
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Replace("windows_v","")

          vpk pack `
            --packId SecurePassword `
            --packVersion $version `
            --packDir ".\artifacts\publish" `
            --outputDir ".\artifacts\velopack"

      # ---------- Create release if missing ----------
      - name: Create release if missing
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          gh release view $env:GITHUB_REF_NAME --repo "ARCHBOTIK/SecurePassword_Releases" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME `
              --repo "ARCHBOTIK/SecurePassword_Releases" `
              --title $env:GITHUB_REF_NAME `
              --notes "Windows release $env:GITHUB_REF_NAME"
          }

      # ---------- Upload Velopack artifacts ----------
      - name: Upload Velopack artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          $files = Get-ChildItem ".\artifacts\velopack" -File

          if (-not $files) {
            Write-Error "No Velopack artifacts found"
            exit 1
          }

          foreach ($file in $files) {
            gh release upload $env:GITHUB_REF_NAME $file.FullName `
              --clobber `
              --repo "ARCHBOTIK/SecurePassword_Releases"
          }
