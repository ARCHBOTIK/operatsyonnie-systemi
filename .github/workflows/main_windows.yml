name: Release Windows
on:
  push:
    tags:
      - "windows_v*.*.*"

permissions:
  contents: read

jobs:
  build-pack-upload:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: dotnet info
        shell: pwsh
        run: |
          dotnet --list-sdks
          dotnet --info

      # ---------- Install all MAUI workloads ----------
      - name: Restore MAUI workloads (all platforms)
        shell: pwsh
        run: dotnet workload install maui maui-windows maui-android maui-ios maui-maccatalyst

      # ---------- UI (MAUI) ----------
      - name: Restore UI (Windows only, win-x64)
        shell: pwsh
        run: |
          dotnet msbuild ".\SecurePassword\SecurePassword\SecurePassword.csproj" `
            /t:Restore `
            /p:TargetFramework=net10.0-windows10.0.19041.0 `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=true

      - name: Publish UI (Windows only, win-x64)
        shell: pwsh
        run: |
          dotnet publish ".\SecurePassword\SecurePassword\SecurePassword.csproj" `
            -c Release `
            -f net10.0-windows10.0.19041.0 `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishReadyToRun=false `
            -o ".\artifacts\releases"
            
      - name: Create release if missing
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          gh release view $env:GITHUB_REF_NAME --repo "ARCHBOTIK/SecurePassword_Releases" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME `
              --repo "ARCHBOTIK/SecurePassword_Releases" `
              --title $env:GITHUB_REF_NAME `
              --notes "Windows release $env:GITHUB_REF_NAME"
          }

      - name: Upload EXE to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          gh release upload $env:GITHUB_REF_NAME .\artifacts\releases\* `
            --clobber `
            --repo "ARCHBOTIK/SecurePassword_Releases"
