name: Release Windows

on:
  push:
    tags:
      - "windows_v*.*.*"

permissions:
  contents: read

jobs:
  build-pack-upload:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: dotnet info
        shell: pwsh
        run: |
          dotnet --list-sdks
          dotnet --info

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag -replace '^windows_v', ''
          echo "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      # Для Windows-сборки не нужно ставить все workload всех платформ
      - name: Install MAUI workloads
        shell: pwsh
        run: |
          dotnet workload install maui maui-windows

      - name: Restore UI
        shell: pwsh
        run: |
          dotnet restore ".\SecurePassword\SecurePassword\SecurePassword.csproj" `
            -p:TargetFramework=net10.0-windows10.0.19041.0 `
            -p:RuntimeIdentifier=win-x64

      - name: Publish UI
        shell: pwsh
        run: |
          dotnet publish ".\SecurePassword\SecurePassword\SecurePassword.csproj" `
            -c Release `
            -f net10.0-windows10.0.19041.0 `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -o ".\artifacts\publish"

      - name: Install Velopack CLI
        shell: pwsh
        run: |
          dotnet tool install --global vpk
          echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Pack with Velopack
        shell: pwsh
        run: |
          vpk pack `
            --packId "SecurePassword" `
            --packVersion "${{ steps.version.outputs.version }}" `
            --packDir ".\artifacts\publish" `
            --mainExe "VaultMech.exe" `
            --packTitle "SecurePassword" `
            --outputDir ".\artifacts\velopack"

      - name: Create release if missing
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          gh release view $env:GITHUB_REF_NAME --repo "ARCHBOTIK/SecurePassword_Releases" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME `
              --repo "ARCHBOTIK/SecurePassword_Releases" `
              --title $env:GITHUB_REF_NAME `
              --notes "Windows release $env:GITHUB_REF_NAME"
          }

      - name: Upload Velopack artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          $files = Get-ChildItem ".\artifacts\velopack" -File
          if (-not $files) {
            Write-Error "Velopack artifacts not found in .\artifacts\velopack"
            exit 1
          }

          $paths = $files | ForEach-Object { $_.FullName }
          gh release upload $env:GITHUB_REF_NAME $paths `
            --clobber `
            --repo "ARCHBOTIK/SecurePassword_Releases"
