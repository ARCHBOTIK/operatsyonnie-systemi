name: Release Windows

on:
  push:
    tags:
      - "windows_v*.*.*"

permissions:
  contents: read

jobs:
  build-pack-upload:
    runs-on: windows-latest

    env:
      PROJECT_PATH: .\SecurePassword\SecurePassword\SecurePassword.csproj
      TFM: net10.0-windows10.0.19041.0
      RID: win-x64

      # Текущий stable Windows App SDK x64 installer из официальной страницы downloads.
      # При желании закрепи на ту же major/minor версию, что и в твоём Microsoft.WindowsAppSDK package.
      WINAPPSDK_INSTALLER_URL: https://download.microsoft.com/download/e28b236e-e201-409d-b045-f303907c5226/WindowsAppRuntimeInstall-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: dotnet info
        shell: pwsh
        run: |
          dotnet --list-sdks
          dotnet --info

      - name: Install MAUI workloads
        shell: pwsh
        run: |
          dotnet workload install maui maui-windows

      - name: Restore Windows app
        shell: pwsh
        run: |
          dotnet msbuild "$env:PROJECT_PATH" `
            /t:Restore `
            /p:TargetFramework=$env:TFM `
            /p:RuntimeIdentifierOverride=$env:RID `
            /p:WindowsPackageType=None `
            /p:WindowsAppSDKSelfContained=false

      - name: Publish Windows app (framework-dependent)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ".\artifacts\publish" -Force | Out-Null

          dotnet publish "$env:PROJECT_PATH" `
            -c Release `
            -f $env:TFM `
            --self-contained false `
            -p:RuntimeIdentifierOverride=$env:RID `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=false `
            -p:PublishReadyToRun=false `
            -o ".\artifacts\publish"

      - name: Remove debug symbols and xml docs
        shell: pwsh
        run: |
          Get-ChildItem ".\artifacts\publish" -Recurse -Include *.pdb, *.xml |
            Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Install Velopack CLI
        shell: pwsh
        run: |
          dotnet tool install --global vpk

      - name: Pack app with Velopack bootstrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ".\artifacts\velopack" -Force | Out-Null

          $version = $env:GITHUB_REF_NAME.Replace("windows_v", "")

          vpk pack `
            --packId SecurePassword `
            --packVersion $version `
            --packDir ".\artifacts\publish" `
            --outputDir ".\artifacts\velopack" `
            --mainExe "VaultPass.exe" `
            --framework "net10.0-x64-desktop,webview2"

      - name: Find Velopack Setup.exe
        id: findsetup
        shell: pwsh
        run: |
          $setup = Get-ChildItem ".\artifacts\velopack" -Filter "Setup.exe" -File -Recurse | Select-Object -First 1
          if (-not $setup) {
            throw "Velopack Setup.exe not found"
          }

          "setup_path=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download Windows App SDK Runtime installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ".\artifacts\prereqs" -Force | Out-Null

          Invoke-WebRequest `
            -Uri $env:WINAPPSDK_INSTALLER_URL `
            -OutFile ".\artifacts\prereqs\WindowsAppRuntimeInstall-x64.exe"

          if (-not (Test-Path ".\artifacts\prereqs\WindowsAppRuntimeInstall-x64.exe")) {
            throw "Windows App SDK installer download failed"
          }

      - name: Install WiX Toolset CLI
        shell: pwsh
        run: |
          dotnet tool install --global wix

      - name: Build single bundle installer (WiX Burn)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ".\artifacts\bundle" -Force | Out-Null

          $version = $env:GITHUB_REF_NAME.Replace("windows_v", "")

          wix build ".\.github\wix\Bundle.wxs" `
            -ext WixToolset.Bal.wixext `
            -d BundleVersion=$version `
            -d WindowsAppRuntimeInstaller="$(Resolve-Path '.\artifacts\prereqs\WindowsAppRuntimeInstall-x64.exe')" `
            -d VelopackSetupExe="${{ steps.findsetup.outputs.setup_path }}" `
            -o ".\artifacts\bundle\SecurePassword-Setup.exe"

      - name: Create release if missing
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          gh release view $env:GITHUB_REF_NAME --repo "ARCHBOTIK/SecurePassword_Releases" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME `
              --repo "ARCHBOTIK/SecurePassword_Releases" `
              --title $env:GITHUB_REF_NAME `
              --notes "Windows release $env:GITHUB_REF_NAME"
          }

      - name: Upload final single installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          gh release upload $env:GITHUB_REF_NAME ".\artifacts\bundle\SecurePassword-Setup.exe" `
            --clobber `
            --repo "ARCHBOTIK/SecurePassword_Releases"
