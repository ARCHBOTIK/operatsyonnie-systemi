name: Release Windows

on:
  push:
    tags:
      - "windows_v*.*.*"

permissions:
  contents: read

jobs:
  build-pack-upload:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: dotnet info
        shell: pwsh
        run: |
          dotnet --list-sdks
          dotnet --info

      - name: Install MAUI workloads
        shell: pwsh
        run: |
          dotnet workload install maui maui-windows

      - name: Restore Windows app
        shell: pwsh
        run: |
          dotnet msbuild ".\SecurePassword\SecurePassword\SecurePassword.csproj" `
            /t:Restore `
            /p:TargetFramework=net10.0-windows10.0.19041.0 `
            /p:RuntimeIdentifierOverride=win-x64 `
            /p:WindowsPackageType=None `
            /p:WindowsAppSDKSelfContained=true

      - name: Publish Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ".\artifacts\publish" -Force | Out-Null

          dotnet publish ".\SecurePassword\SecurePassword\SecurePassword.csproj" `
            -c Release `
            -f net10.0-windows10.0.19041.0 `
            --self-contained true `
            -p:RuntimeIdentifierOverride=win-x64 `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:PublishReadyToRun=false `
            -o ".\artifacts\publish"

      - name: Remove debug symbols and xml docs
        shell: pwsh
        run: |
          Get-ChildItem ".\artifacts\publish" -Recurse -Include *.pdb, *.xml |
            Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Install Velopack CLI
        shell: pwsh
        run: |
          dotnet tool install --global vpk

      - name: Pack with Velopack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ".\artifacts\velopack" -Force | Out-Null

          $version = $env:GITHUB_REF_NAME.Replace("windows_v", "")

          vpk pack `
            --packId SecurePassword `
            --packVersion $version `
            --packDir ".\artifacts\publish" `
            --outputDir ".\artifacts\velopack" `
            --mainExe "VaultPass.exe"

      - name: Create release if missing
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          gh release view $env:GITHUB_REF_NAME --repo "ARCHBOTIK/SecurePassword_Releases" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME `
              --repo "ARCHBOTIK/SecurePassword_Releases" `
              --title $env:GITHUB_REF_NAME `
              --notes "Windows release $env:GITHUB_REF_NAME"
          }

      - name: Upload Velopack artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          $files = Get-ChildItem ".\artifacts\velopack" -File
          if (-not $files) {
            Write-Error "No Velopack artifacts found"
            exit 1
          }

          foreach ($file in $files) {
            gh release upload $env:GITHUB_REF_NAME $file.FullName `
              --clobber `
              --repo "ARCHBOTIK/SecurePassword_Releases"
          }